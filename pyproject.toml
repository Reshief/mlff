[project]
name = "mlff"
version = "1.0.0"
description = "Machine learning force fields with JAX."
authors = [{ name = "Thorben Frank, Adil Kabylda, Marcel Langer, Florian Knoop" }]
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy",
    "clu==0.0.9",
    "e3x",
    "flax",
    "jaxopt",
    "optax",
    "orbax-checkpoint",
    "portpicker",
    "pandas",
    "scikit-learn",
    "ase",
    "tqdm",
    "wandb",
    "pyyaml",
    "pytest",
    "h5py",
    "ml_collections",
    "setuptools<81",
    "jraph",
    "jax-md",
    "glp",
    "jax-pme",
]

[project.scripts]
mlff_evaluate = "mlff.cAPI.mlff_eval:evaluate"
mlff_train = "mlff.cAPI.mlff_train:train"
mlff_run_md = "mlff.cAPI.mlff_md:run_md"
mlff_run_relaxation = "mlff.cAPI.mlff_structure_relaxation:run_relaxation"
mlff_analyse_md = "mlff.cAPI.mlff_analyse:analyse_md"
mlff_train_so3krates = "mlff.cAPI.mlff_train_so3krates:train_so3krates"
mlff_train_so3kratACE = "mlff.cAPI.mlff_train_so3kratace:train_so3kratace"
mlff_trajectory_to_xyz = "mlff.cAPI.mlff_postprocessing:trajectory_to_xyz"
mlff_to_mlff_input = "mlff.cAPI.mlff_input_processing:to_mlff_input"
mlff_train_so3krates_sparse = "mlff.CLI.run_training:train_so3krates_sparse"
mlff_train_itp_net = "mlff.CLI.run_training_itp_net:train_itp_net"
mlff_evaluate_itp_net = "mlff.CLI.run_evaluation_itp_net:evaluate_itp_net"
mlff_evaluate_itp_net_on = "mlff.CLI.run_evaluation_itp_net_on:evaluate_itp_net_on"
mlff_fine_tune_so3krates_sparse = "mlff.CLI.run_fine_tuning:fine_tune_so3krates_sparse"
mlff_evaluate_so3krates_sparse = "mlff.CLI.run_evaluation:evaluate_so3krates_sparse"
mlff_evaluate_so3krates_sparse_on = "mlff.CLI.run_evaluation_on:evaluate_so3krates_sparse_on"

[tool.uv.sources]
jraph = { git = "https://github.com/kabylda/jraph.git", branch = "master" }
jax-md = { git = "https://github.com/kabylda/jax-md.git", branch = "main" }
glp = { git = "https://github.com/kabylda/glp.git", branch = "electrostatics_neighbourlist" }
jax-pme = { git = "https://github.com/fbruenig/jax-pme", branch = "main" }

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"

